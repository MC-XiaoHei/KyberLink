[project]
name = "kyberlink"
version = "0.1.0"
description = "KyberLink FPGA bridge build/test entry"
requires-python = ">=3.10"
dependencies = [
    "cocotb>=2.0.1,<3",
    "pytest>=7",
    "liboqs-python>=0.16",
    "pycryptodome>=3.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
