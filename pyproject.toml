[project]
name = "kyberlink"
version = "0.1.0"
description = "KyberLink"
requires-python = ">=3.10"
dependencies = [
    "cocotb>=2.0.1,<3",
    "pytest>=7",
    "liboqs-python>=0.16",
    "pycryptodome>=3.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["run.py", "utils"]
typeCheckingMode = "basic"
executionEnvironments = [{ root = ".", extraPaths = ["."] }]

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = "build/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
    "SIM115",
    "PLW1510",
    "RUF059",
]

[tool.ruff.lint.per-file-ignores]
"sim.py" = ["F821"]
