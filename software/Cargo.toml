[workspace]
resolver = "2"
members = [
    "crates/kyberlink-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ml-kem = "0.3.2"
ml-dsa = "0.1.1"
aes-gcm = "0.10"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand_core = "0.6"
