[workspace]
resolver = "2"
members = [
    "crates/kyberlink-vecgen",
    "crates/kyberlink-crypto",
    "crates/kyberlink-core",
    "crates/kyberlink-board",
    "crates/kyberlink-firmware",
    "crates/kyberlink-simnode",
    "crates/kyberlink-mdio",
]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
