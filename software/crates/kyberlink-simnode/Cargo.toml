[package]
name = "kyberlink-simnode"
description = "KyberLink firmware logic hosted as a simulation node (cdylib for cocotb)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kyberlink-core = { path = "../kyberlink-core", features = ["std"] }
kyberlink-crypto = { path = "../kyberlink-crypto", features = ["std"] }
embassy-sync = "0.8.0"
parking_lot = "0.12.1"
