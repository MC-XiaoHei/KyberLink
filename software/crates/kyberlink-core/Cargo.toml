[package]
name = "kyberlink-core"
description = "KyberLink firmware core logic"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
kyberlink-crypto = { path = "../kyberlink-crypto" }
embassy-sync = "0.8.0"
critical-section = "1.2.0"
parking_lot = { version = "0.12.1", optional = true }

[features]
std = ["kyberlink-crypto/std", "critical-section/std"]
ffi = ["std", "parking_lot"]

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
