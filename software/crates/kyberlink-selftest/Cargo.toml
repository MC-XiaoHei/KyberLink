[package]
name = "kyberlink-selftest"
description = "KyberLink Board Self Test Firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kyberlink-board = { path = "../kyberlink-board" }
kyberlink-core = { path = "../kyberlink-core" }
kyberlink-mdio = { path = "../kyberlink-mdio" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal", rev = "07663312c9da6b9962e8699a917c623bc833972e", features = ["ch32v208gbu6", "embassy", "rt", "memory-x"] }
embassy-executor = { version = "0.10.0", features = ["platform-riscv32", "executor-thread"] }
embassy-time = "0.5.1"
